# Builds the Windows, Linux and macOS downloads with electron-builder, each with ffmpeg included.
# Pushing a tag like v1.2.0 also publishes them as a GitHub release; running it by hand
# only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ffmpeg: linux64-gpl-shared-8.1.tar.xz
          - os: windows-latest
            platform: win
            ffmpeg: win64-gpl-shared-8.1.zip
          # one DMG per Mac architecture, each built on a runner of that architecture
          - os: macos-latest
            platform: mac
            ffmpeg: arm64/1789931890_9.0.2
          - os: macos-15-intel
            platform: mac
            ffmpeg: amd64/1789931006_9.0.2
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # installs Node.js, the pnpm from packageManager in package.json, and the
      # dependencies exactly as pnpm-lock.yaml has them
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm test

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-git-checks

      # BtbN's shared build: ffmpeg and ffprobe share one copy of the libraries, which
      # halves the download. On Linux the binaries find them in ../lib, on Windows next to them.
      - name: Download ffmpeg
        if: matrix.platform != 'mac'
        run: |
          curl -fsSL -o ffmpeg-archive "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-${{ matrix.ffmpeg }}"
          mkdir unpacked ffmpeg
          if [ "${{ matrix.platform }}" = linux ]; then
            tar -xJf ffmpeg-archive -C unpacked
            src=$(echo unpacked/*)
            mkdir ffmpeg/bin ffmpeg/lib
            cp "$src"/bin/ffmpeg "$src"/bin/ffprobe ffmpeg/bin/
            # only the names the binaries link against, not the symlinks to them
            for lib in "$src"/lib/*.so.*; do
              case "$lib" in *.so.*.*) ;; *) cp -L "$lib" ffmpeg/lib/ ;; esac
            done
          else
            7z x -bd -ounpacked ffmpeg-archive > /dev/null
            src=$(echo unpacked/*)
            mkdir ffmpeg/bin
            cp "$src"/bin/ffmpeg.exe "$src"/bin/ffprobe.exe "$src"/bin/*.dll ffmpeg/bin/
          fi
          cp "$src"/LICENSE.txt ffmpeg/

      # BtbN has no macOS builds, so the Macs get Martin Riedl's static ones. Their zips
      # carry no license; these builds are GPL version 3.
      - name: Download ffmpeg for macOS
        if: matrix.platform == 'mac'
        run: |
          base="https://ffmpeg.martin-riedl.de/download/macos/${{ matrix.ffmpeg }}"
          mkdir -p ffmpeg/bin
          for tool in ffmpeg ffprobe; do
            curl -fsSL -o $tool.zip "$base/$tool.zip"
            curl -fsSL "$base/$tool.zip.sha256" | shasum -a 256 -c
            unzip -q $tool.zip -d ffmpeg/bin
          done
          curl -fsSL -o ffmpeg/LICENSE.txt "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n9.0.2/COPYING.GPLv3"

      - run: ffmpeg/bin/ffmpeg -hide_banner -encoders | grep -q libx264

      - run: pnpm exec electron-builder --${{ matrix.platform }} --publish never

      # one unzipped artifact per download, named after the file, so a run's page lists
      # them like a release does
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux'
        with:
          path: dist/snip-linux-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux'
        with:
          path: dist/snip-linux-amd64.deb
          archive: false
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'win'
        with:
          path: dist/snip-windows-x64-setup.exe
          archive: false
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'mac'
        with:
          path: dist/snip-mac-*.dmg
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
